<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="488.7pt" height="385.848pt" viewBox="0 0 488.7 385.848" xmlns="http://www.w3.org/2000/svg" version="1.1" role="img" aria-labelledby="shapes-svg-title shapes-svg-desc">
 <title id="shapes-svg-title">LeWorldModel forward-pass tensor shapes</title>
 <desc id="shapes-svg-desc">Diagram showing the concrete tensor shapes that flow through one forward pass. The input RGB tensor has shape B by 3 by 224 by 224, where B is batch size. The ViT-tiny encoder maps it to shape B by 192. A history-stacking step packs the three most recent latents into shape B by 3 by 192, alongside three action embeddings of shape B by 3 by action_dim. The 6-layer transformer predictor consumes both and outputs the predicted next latent at shape B by 192, living in the same 192-dimensional space as the encoder output so multi-step rollouts can feed predictions back as if they were observations. A cost head then computes a scalar by taking squared distance between predicted latents and the goal latent.</desc>
